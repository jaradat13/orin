[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orin"
version = "1.0.0"
authors = [
    { name = "Musa Jaradat" }
]
description = "Orin – Production-Grade Offline Forensic Investigation & Integrity Engine"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["forensics", "incident-response", "security", "integrity", "rootkit", "offline"]
classifiers = [
    "Development Status :: 5 :: Production/Stable",
    "Intended Audience :: Information Technology",
    "License :: Other/Proprietary License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security"
]
dependencies = []

[project.optional-dependencies]
# Optional wrapper optimization for platform checks if native /proc parsing requires redundancy checks
dev = [
    "psutil>=5.9.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]

[project.scripts]
orin = "orin.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["orin*"]

[tool.setuptools.package-data]
"orin.core" = ["*.html"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=orin --cov-report=term-missing --cov-fail-under=85"
testpaths = [
    "tests"
]